<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Delete your Meet account</title><style>body{font-family:system-ui;max-width:560px;margin:40px auto;padding:20px}input,button{width:100%;padding:12px;margin:8px 0;box-sizing:border-box}button{font-weight:700}.danger{background:#b42318;color:#fff;border:0;border-radius:8px}</style></head>
<body><h1>Delete your Meet account</h1><p>Sign in below to permanently delete your Meet account and associated data. This cannot be undone.</p><form id="f"><input id="email" type="email" required placeholder="Email"><input id="password" type="password" required placeholder="Password"><button class="danger">Delete account</button></form><p id="status"></p><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2.116.0';
const supabase=createClient('https://igsucrszgotwrifbrvxd.supabase.co','sb_publishable_8wR49vTI4RO90t9ctzq8uA_ApfidSbJ');
const f=document.querySelector('#f'),s=document.querySelector('#status');
f.addEventListener('submit',async e=>{e.preventDefault();s.textContent='Signing in…';const {error}=await supabase.auth.signInWithPassword({email:email.value,password:password.value});if(error){s.textContent=error.message;return}s.textContent='Deleting…';const r=await supabase.functions.invoke('delete-account',{body:{}});if(r.error){s.textContent=r.error.message;return}await supabase.auth.signOut();s.textContent='Your Meet account deletion request has been completed.';f.reset()});
</script></body></html>
