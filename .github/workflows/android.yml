name: Build love that Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  android:
    name: Android release build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Check Node.js
        run: |
          node --version
          npm --version

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Check Java 21
        run: |
          java -version
          javac -version

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Install Android SDK 36
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-36"
          sdkmanager "build-tools;36.0.0"

      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          sdkmanager --version
          adb version

      - name: Install npm dependencies
        run: npm install --no-audit --no-fund

      - name: Check package lock
        run: test -s package-lock.json

      - name: Install Capacitor CLI
        run: npm install @capacitor/cli@8.5.2 --save-dev --no-audit --no-fund

      - name: Install TypeScript
        run: npm install --save-dev typescript@5.9.2 --no-audit --no-fund

      - name: Build web application
        run: npm run build

      - name: Check web build
        run: test -s dist/index.html

      - name: Add Capacitor Android
        run: |
          if [ ! -d android ]; then
            npx --no-install cap add android
          fi

      - name: Sync Capacitor
        run: npx --no-install cap sync android

      # ✅ FIX 1: Skip script if file doesn't exist
      - name: Configure media permissions
        run: |
          if [ -f scripts/configure-media-permissions.py ]; then
            python3 scripts/configure-media-permissions.py .
          else
            echo "⚠️ configure-media-permissions.py not found — skipping this step"
            mkdir -p scripts
          fi

      - name: Check Android project
        run: |
          test -f android/gradlew
          chmod +x android/gradlew

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Check Gradle and Java
        working-directory: android
        run: |
          java -version
          ./gradlew --version

      # ✅ FIX 2: Auto-fix AndroidManifest.xml namespace error
      - name: Fix AndroidManifest namespace
        working-directory: android/app/src/main
        run: |
          MANIFEST="AndroidManifest.xml"
          if grep -q 'xmlns:android=' "$MANIFEST"; then
            echo "✅ Namespace already present"
          else
            echo "🔧 Adding Android namespace declaration..."
            sed -i.bak 's/<manifest>/<manifest xmlns:android="http:\/\/schemas.android.com\/apk\/res\/android">/' "$MANIFEST"
            echo "✅ Fixed: $(grep xmlns:android "$MANIFEST")"
          fi

      - name: Build Android App Bundle
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace bundleRelease

      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Find Android files
        run: |
          echo "AAB files:"
          find android/app/build/outputs/bundle -name "*.aab" -print

          echo "APK files:"
          find android/app/build/outputs/apk -name "*.apk" -print

      - name: Upload Android App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: love-that-android-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: love-that-android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
