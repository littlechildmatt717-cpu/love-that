name: Build love that Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  android:
    name: Android release build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Check Node.js
        run: |
          node --version
          npm --version

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Check Java 21
        run: |
          java -version
          javac -version

      # Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          sdk-tools-version: "11.0"
      
      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses || true
      
      - name: Install Android SDK components
        run: |
          sdkmanager --update
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-36"
          sdkmanager "build-tools;36.0.0
          
      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          sdkmanager --version
          adb version

      # Node / React / Vite
      - name: Install npm dependencies
        run: npm install --no-audit --no-fund

      - name: Check package lock
        run: test -s package-lock.json

      - name: Check project files
        run: |
          test -f package.json
          test -f index.html
          test -f src/main.jsx
          test -f src/App.jsx
          echo "Required project files found."

      - name: Build web application
        run: npm run build

      - name: Check web build
        run: test -s dist/index.html

      # Capacitor
      - name: Install Capacitor CLI
        run: |
          npm install @capacitor/cli@8.5.2 --save-dev --no-audit --no-fund
          test -f node_modules/.bin/cap
          node_modules/.bin/cap --version

      - name: Add Capacitor Android
        run: |
          if [ ! -d android ]; then
            node_modules/.bin/cap add android
          fi

      - name: Sync Capacitor
        run: node_modules/.bin/cap sync android

      # Android project
      - name: Check Android project
        run: |
          test -f android/gradlew
          chmod +x android/gradlew

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check Gradle and Java
        working-directory: android
        run: |
          java -version
          ./gradlew --version

      # Release AAB
      - name: Build Android App Bundle
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace bundleRelease

      # Debug APK
      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      # Find generated files
      - name: Find Android files
        run: |
          echo "AAB files:"
          find android/app/build/outputs/bundle -name "*.aab" -print

          echo "APK files:"
          find android/app/build/outputs/apk -name "*.apk" -print

      # Upload AAB
      - name: Upload Android App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: love-that-android-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14

      # Upload debug APK
      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: love-that-android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
