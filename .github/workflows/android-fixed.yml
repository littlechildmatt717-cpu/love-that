name: Build love that Android

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  android-release:
    name: Android release build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify Node and npm
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: |
          set -euo pipefail
          echo "Installing dependencies with npm install."
          echo "This also reconciles package.json and package-lock.json if required."
          npm install --no-audit --no-fund
          echo "Dependencies installed successfully."

      - name: Build web application
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          # Do NOT request the deprecated "tools" package.
          # platform-tools is sufficient here; the command-line tools
          # required by this action are installed by the action itself.
          packages: 'platform-tools'

      - name: Show Android SDK information
        shell: bash
        run: |
          set -euo pipefail

          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"
          sdkmanager --version
          adb version || true

      - name: Add Android platform
        run: |
          set -euo pipefail

          if [ ! -d android ]; then
            echo "Android directory does not exist."
            echo "Creating Android project with Capacitor..."
            npx cap add android
          else
            echo "Android directory already exists."
          fi

      - name: Sync Capacitor Android
        run: |
          set -euo pipefail
          npx cap sync android

      - name: Detect Android SDK requirements
        shell: bash
        run: |
          set -euo pipefail

          echo "Detecting compileSdk from the generated Android project..."

          COMPILE_SDK=""

          if [ -f android/variables.gradle ]; then
            COMPILE_SDK="$(
              grep -E '^[[:space:]]*ext[[:space:]]+{[[:space:]]*$' /dev/null >/dev/null 2>&1 || true
              grep -E 'compileSdkVersion[[:space:]]*=' android/variables.gradle \
                | tail -n 1 \
                | sed -E 's/.*compileSdkVersion[[:space:]]*=[[:space:]]*//; s/[^0-9].*//'
            )"
          fi

          if [ -z "$COMPILE_SDK" ] && [ -f android/app/build.gradle ]; then
            COMPILE_SDK="$(
              grep -E 'compileSdk(Label|Version)?[[:space:]]+' android/app/build.gradle \
                | head -n 1 \
                | grep -oE '[0-9]+' \
                | head -n 1 || true
            )"
          fi

          if [ -z "$COMPILE_SDK" ]; then
            COMPILE_SDK="35"
            echo "Could not detect compileSdk. Using Android API 35."
          else
            echo "Detected compileSdk: $COMPILE_SDK"
          fi

          echo "COMPILE_SDK=$COMPILE_SDK" >> "$GITHUB_ENV"

      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          echo "Installing Android platform and build tools for API $COMPILE_SDK..."

          sdkmanager \
            "platform-tools" \
            "platforms;android-${COMPILE_SDK}"

          echo "Installed Android SDK packages:"
          sdkmanager --list_installed | head -n 100

      - name: Repair Android manifest safely
        shell: bash
        run: |
          set -euo pipefail

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          if [ ! -f "$MANIFEST" ]; then
            echo "::error::AndroidManifest.xml was not generated."
            exit 1
          fi

          echo "============================================================"
          echo "MANIFEST BEFORE REPAIR"
          echo "============================================================"
          nl -ba "$MANIFEST"

          python3 - "$MANIFEST" <<'PY'
          import re
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")

          permissions = [
              "android.permission.READ_MEDIA_IMAGES",
              "android.permission.READ_MEDIA_VIDEO",
          ]

          # Remove existing copies so each required permission can be
          # inserted exactly once in a known location.
          for permission in permissions:
              pattern = (
                  r'^[ \t]*<uses-permission\b'
                  r'[^>]*android:name\s*=\s*["\']'
                  + re.escape(permission)
                  + r'["\'][^>]*/?>[ \t]*\r?\n?'
              )

              text = re.sub(
                  pattern,
                  "",
                  text,
                  flags=re.MULTILINE,
              )

          match = re.search(
              r'<manifest\b[^>]*>',
              text,
              flags=re.IGNORECASE,
          )

          if not match:
              print("::error::Could not find the opening <manifest> element.")
              sys.exit(1)

          manifest_tag = match.group(0)

          namespace_pattern = (
              r'\s+xmlns:android\s*=\s*'
              r'(["\'])'
              r'http://schemas\.android\.com/apk/res/android'
              r'\1'
          )

          namespace_matches = list(
              re.finditer(namespace_pattern, manifest_tag)
          )

          if len(namespace_matches) > 1:
              print("::error::Multiple xmlns:android declarations were found.")
              print(manifest_tag)
              sys.exit(1)

          if len(namespace_matches) == 0:
              repaired_tag = manifest_tag[:-1].rstrip()
              repaired_tag += (
                  ' xmlns:android='
                  '"http://schemas.android.com/apk/res/android">'
              )

              text = (
                  text[:match.start()]
                  + repaired_tag
                  + text[match.end():]
              )

              match = re.search(
                  r'<manifest\b[^>]*>',
                  text,
                  flags=re.IGNORECASE,
              )

              if not match:
                  print("::error::Unable to locate repaired <manifest> element.")
                  sys.exit(1)

              print("Added missing Android namespace.")
          else:
              print("Android namespace already present.")

          permissions_xml = (
              "\n"
              '    <uses-permission '
              'android:name="android.permission.READ_MEDIA_IMAGES" />\n'
              '    <uses-permission '
              'android:name="android.permission.READ_MEDIA_VIDEO" />\n'
          )

          text = (
              text[:match.end()]
              + permissions_xml
              + text[match.end():]
          )

          path.write_text(text, encoding="utf-8")

          print("Android manifest repair completed.")
          PY

          echo "============================================================"
          echo "MANIFEST AFTER REPAIR"
          echo "============================================================"
          nl -ba "$MANIFEST"

      - name: Validate manifest with Python XML parser
        shell: bash
        run: |
          set -euo pipefail

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          python3 - "$MANIFEST" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path

          path = Path(sys.argv[1])

          try:
              tree = ET.parse(path)
              root = tree.getroot()
          except ET.ParseError as error:
              print("::error::AndroidManifest.xml is invalid XML.")
              print(f"::error::{error}")
              print("")
              print("===== COMPLETE MANIFEST =====")

              for number, line in enumerate(
                  path.read_text(encoding="utf-8").splitlines(),
                  1,
              ):
                  print(f"{number:04d}: {line}")

              print("===== END MANIFEST =====")
              sys.exit(1)

          if root.tag != "manifest":
              print(f"::error::Unexpected root element: {root.tag}")
              sys.exit(1)

          print("Python XML validation PASSED.")
          PY

      - name: Validate manifest with Java XML parser
        shell: bash
        run: |
          set -euo pipefail

          MANIFEST="$PWD/android/app/src/main/AndroidManifest.xml"
          VALIDATOR="$RUNNER_TEMP/ManifestXmlValidator.java"

          cat > "$VALIDATOR" <<'JAVA'
          import java.io.File;
          import javax.xml.XMLConstants;
          import javax.xml.parsers.DocumentBuilderFactory;

          public class ManifestXmlValidator {
              public static void main(String[] args) throws Exception {
                  if (args.length != 1) {
                      throw new IllegalArgumentException(
                          "Manifest path is required"
                      );
                  }

                  File manifest = new File(args[0]);

                  if (!manifest.isFile()) {
                      throw new IllegalStateException(
                          "Manifest does not exist: " + manifest
                      );
                  }

                  DocumentBuilderFactory factory =
                      DocumentBuilderFactory.newInstance();

                  factory.setNamespaceAware(true);
                  factory.setFeature(
                      XMLConstants.FEATURE_SECURE_PROCESSING,
                      true
                  );

                  factory.newDocumentBuilder().parse(manifest);

                  System.out.println(
                      "Java XML validation PASSED: " + manifest
                  );
              }
          }
          JAVA

          javac "$VALIDATOR"
          java -cp "$RUNNER_TEMP" ManifestXmlValidator "$MANIFEST"

      - name: Strict manifest structure check
        shell: bash
        run: |
          set -euo pipefail

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          python3 - "$MANIFEST" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path

          path = Path(sys.argv[1])
          android_ns = "http://schemas.android.com/apk/res/android"
          android_name = f"{{{android_ns}}}name"

          tree = ET.parse(path)
          root = tree.getroot()

          if root.tag != "manifest":
              raise SystemExit(
                  f"Invalid root element: {root.tag}"
              )

          android_attributes = [
              attribute
              for element in root.iter()
              for attribute in element.attrib
              if attribute.startswith(f"{{{android_ns}}}")
          ]

          if not android_attributes:
              raise SystemExit(
                  "No Android namespace attributes were found."
              )

          required = {
              "android.permission.READ_MEDIA_IMAGES",
              "android.permission.READ_MEDIA_VIDEO",
          }

          direct_permissions = []

          for child in root:
              if child.tag == "uses-permission":
                  name = child.attrib.get(android_name)
                  if name:
                      direct_permissions.append(name)

          for permission in required:
              count = direct_permissions.count(permission)

              if count != 1:
                  raise SystemExit(
                      f"{permission} appears {count} times; "
                      "expected exactly once."
                  )

          application = root.find("application")

          if application is not None:
              nested = application.findall("uses-permission")

              if nested:
                  raise SystemExit(
                      "uses-permission is incorrectly nested inside <application>."
                  )

          print("============================================================")
          print("STRICT MANIFEST CHECK PASSED")
          print("============================================================")
          print("Valid XML: YES")
          print("Root element: manifest")
          print("Android namespace: PRESENT")
          print("READ_MEDIA_IMAGES: PRESENT ONCE")
          print("READ_MEDIA_VIDEO: PRESENT ONCE")
          print("Permissions directly under <manifest>: YES")
          print("============================================================")
          PY

          echo "============================================================"
          echo "FINAL MANIFEST BEFORE GRADLE"
          echo "============================================================"
          nl -ba "$MANIFEST"

      - name: Check Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f android/gradlew ]; then
            echo "::error::android/gradlew was not found."
            exit 1
          fi

          chmod +x android/gradlew

      - name: Build Android release bundle
        working-directory: android
        run: |
          set -euo pipefail

          ./gradlew \
            --no-daemon \
            --stacktrace \
            bundleRelease
