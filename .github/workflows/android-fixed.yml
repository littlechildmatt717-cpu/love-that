name: Build love that Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  android:
    name: Android release build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v7  # ✅ Node 24 native

      - name: Set up Node.js 24
        uses: actions/setup-node@v7  # ✅ Node 24 native
        with:
          node-version: '24'

      - name: Check versions
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Build web app
        run: npm run build

      - name: Initialize Capacitor Android if missing
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Android App Bundle
        run: cd android && ./gradlew --no-daemon --stacktrace bundleRelease

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release.aab
          path: android/app/build/outputs/bundle/release/app-release.aab
