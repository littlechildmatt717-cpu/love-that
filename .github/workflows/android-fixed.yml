name: Build love that Android

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  android-release:
    name: Android release build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify Node and npm
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: |
          set -euo pipefail
          echo "Installing dependencies with npm install."
          npm install --no-audit --no-fund
          echo "Dependencies installed successfully."

      - name: Build web application
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Add Android platform
        run: |
          set -euo pipefail
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Repair Android manifest safely
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          test -f "$MANIFEST"

          python3 - "$MANIFEST" <<'PY'
          import re, sys
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")

          permissions = [
              "android.permission.READ_MEDIA_IMAGES",
              "android.permission.READ_MEDIA_VIDEO",
          ]

          for permission in permissions:
              pattern = (
                  r'^[ \t]*<uses-permission\b'
                  r'[^>]*android:name\s*=\s*["\']'
                  + re.escape(permission)
                  + r'["\'][^>]*/?>[ \t]*\r?\n?'
              )
              text = re.sub(pattern, "", text, flags=re.MULTILINE)

          match = re.search(r'<manifest\b[^>]*>', text, re.IGNORECASE)
          if not match:
              raise SystemExit("::error::No <manifest> root element found.")

          tag = match.group(0)
          ns = re.findall(
              r'\s+xmlns:android\s*=\s*(["\'])'
              r'http://schemas\.android\.com/apk/res/android\1',
              tag,
          )

          if len(ns) > 1:
              raise SystemExit("::error::Duplicate xmlns:android declarations found.")

          if len(ns) == 0:
              repaired = tag[:-1].rstrip() + (
                  ' xmlns:android="http://schemas.android.com/apk/res/android">'
              )
              text = text[:match.start()] + repaired + text[match.end():]
              match = re.search(r'<manifest\b[^>]*>', text, re.IGNORECASE)

          permissions_xml = (
              '\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />'
              '\n    <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />\n'
          )
          text = text[:match.end()] + permissions_xml + text[match.end():]
          path.write_text(text, encoding="utf-8")
          PY

          echo "===== FINAL MANIFEST ====="
          nl -ba "$MANIFEST"

      - name: Validate manifest with Python
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse("android/app/src/main/AndroidManifest.xml")
          print("Python XML validation PASSED.")
          PY

      - name: Validate manifest with Java XML parser
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ManifestXmlValidator.java" <<'JAVA'
          import java.io.File;
          import javax.xml.XMLConstants;
          import javax.xml.parsers.DocumentBuilderFactory;

          public class ManifestXmlValidator {
              public static void main(String[] args) throws Exception {
                  DocumentBuilderFactory f = DocumentBuilderFactory.newInstance();
                  f.setNamespaceAware(true);
                  f.setFeature(XMLConstants.FEATURE_SECURE_PROCESSING, true);
                  f.newDocumentBuilder().parse(new File(args[0]));
                  System.out.println("Java XML validation PASSED.");
              }
          }
          JAVA
          javac "$RUNNER_TEMP/ManifestXmlValidator.java"
          java -cp "$RUNNER_TEMP" ManifestXmlValidator "$PWD/android/app/src/main/AndroidManifest.xml"

      - name: Strict manifest structure check
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import xml.etree.ElementTree as ET

          path = "android/app/src/main/AndroidManifest.xml"
          root = ET.parse(path).getroot()
          ns = "http://schemas.android.com/apk/res/android"
          name = f"{{{ns}}}name"

          if root.tag != "manifest":
              raise SystemExit("Invalid manifest root.")

          permissions = [
              c.attrib.get(name)
              for c in root
              if c.tag == "uses-permission"
          ]

          required = {
              "android.permission.READ_MEDIA_IMAGES",
              "android.permission.READ_MEDIA_VIDEO",
          }

          for permission in required:
              if permissions.count(permission) != 1:
                  raise SystemExit(
                      f"{permission} must appear exactly once."
                  )

          app = root.find("application")
          if app is not None and app.findall("uses-permission"):
              raise SystemExit(
                  "uses-permission is incorrectly inside <application>."
              )

          print("Strict manifest validation PASSED.")
          PY

      - name: Check Gradle wrapper
        run: |
          set -euo pipefail
          test -f android/gradlew
          chmod +x android/gradlew

      - name: Build Android release bundle
        working-directory: android
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace bundleRelease
