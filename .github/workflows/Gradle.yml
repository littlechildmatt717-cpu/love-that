name: Java 21 Check

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  java21:
    name: Verify Java 21
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify Java 21
        run: |
          java -version
          javac -version
          java -version 2>&1 | grep '21'
          javac -version | grep '21'

      - name: Java 21 ready
        run: echo "Java 21 is installed and ready."
